<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pounce - Territory Capture Game</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }
      #app-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      #ui-container {
        background-color: #1A252F;
        color: #FFD700;
        padding: 10px 20px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 5px;
        min-width: 300px;
        text-align: center;
        display: none; /* Hidden by default, shown when GameScene starts */
      }
      #powerup-container {
        background: linear-gradient(135deg, #2C3E50, #34495E);
        color: #ECF0F1;
        padding: 8px 16px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 5px;
        border: 2px solid #3498DB;
        text-align: center;
        display: none;
        animation: pulse 0.5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        from { transform: scale(1); }
        to { transform: scale(1.05); }
      }
      #game-container {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #version-display {
        position: fixed;
        bottom: 10px;
        right: 10px;
        color: #FFD700;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        opacity: 0.7;
        pointer-events: none;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="app-wrapper">
      <div id="ui-container" style="display: none;">Territory: 0.0% | Lives: 3</div>
      <div id="powerup-container"></div>
      <div id="game-container"></div>
    </div>
    <div id="version-display">v1.0.0</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
